<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="ROCK-PAPER-SCISSORS-TON/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TON Rock-Paper-Scissors</h1>
            <p>Играй на криптовалюте TON!</p>
        </header>
        
        <main>
            <div class="welcome-section">
                <h2>Добро пожаловать!</h2>
                <p>Соединяйся с игроками онлайн и выигрывай TON!</p>
                <button id="connectWallet" class="btn btn-primary">Подключить кошелёк</button>
            </div>
            
            <div class="lobby-section" id="lobbySection" style="display: none;">
                <h2>Лобби</h2>
                <div class="filters">
                    <label for="minBet">Минимальная ставка:</label>
                    <input type="number" id="minBet" value="0.5" step="0.5">
                    
                    <label for="maxBet">Максимальная ставка:</label>
                    <input type="number" id="maxBet" value="10000" step="100">
                    
                    <button id="applyFilters" class="btn">Применить фильтры</button>
                </div>
                
                <div class="rooms-list" id="roomsList">
                    <!-- Комнаты будут загружаться динамически -->
                </div>
                
                <button id="createRoom" class="btn btn-success">Создать комнату</button>
            </div>

            
            <div id="status">Статус: не подключено</div>
        </main>
    </div>
    
    
    <!-- ... остальной код ... -->

<script src="js/ton-integration.js"></script>
<script src="ROCK-PAPER-SCISSORS-TON/game.js"></script>
<script src="js/ui.js"></script>
<script src="public/js/main.js"></script>
<!-- <script src="js/main.js"></script> -->


</body>
</html>
